# Bio.tools Quality Evaluation Configuration
# This file contains default settings for the application

[api]
# Bio.tools API settings
base_url = https://bio.tools/api/
rate_limit = 1.0
timeout = 30
max_retries = 3

[cache]
# Caching settings
enabled = true
directory = data/cache
expire_hours = 24

[analysis]
# Analysis settings
default_max_tools = 100
batch_size = 50

[scoring]
# Quality scoring weights
schema_weight = 0.3
standards_weight = 0.4
linter_weight = 0.3

[output]
# Default output settings
default_format = json
charts_enabled = true
dashboard_enabled = true

[logging]
# Logging configuration
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
