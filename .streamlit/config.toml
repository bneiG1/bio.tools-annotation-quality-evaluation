[global]

# By default, Streamlit checks if the Python watchdog module is available 
# and, if not, prints a warning asking for you to install it. The watchdog module is not required.
# Note: disableWatchdogWarning has been removed in newer versions

# By default, Streamlit displays a warning when a user sets both a widget
# default value in the function defining the widget and a widget value via
# the widget's key in `st.session_state`.
# Note: showWarningOnDirectExecution has been removed in newer versions

# Configure the ability to share apps publicly via Streamlit Community Cloud
# Note: showErrorDetails has been removed in newer versions

# Deployment-specific settings
# File watcher settings are now handled automatically by Streamlit

[server]

# List of folders that should not be watched for changes. This impacts both "Run on Save" and @st.cache.
folderWatchBlacklist = ['']

# Change the type of file watcher used by Streamlit, or turn it off completely.
fileWatcherType = "auto"

# Symmetric key used to produce signed cookies. If deploying on multiple replicas, this should be set to the same value across all replicas to ensure they all share the same secret.
cookieSecret = "bio-tools-quality-dashboard-secret-key"

# If false, will attempt to open a browser window on start.
headless = true

# Automatically rerun script when the file is modified on disk.
runOnSave = false

# The address where the server will listen for client and browser connections. Use this if you want to bind the server to a specific address. If set, the server will only be accessible from this address, and not from any aliases (like localhost).
address = "0.0.0.0"

# The port where the server will listen for browser connections.
port = 8501

# Alternative ports to try if main port is busy
# Note: This is handled by our deployment script
# port = 8502
# port = 8503

# The base path for the URL where Streamlit should be reachable from.
baseUrlPath = ""

# Enables support for Cross-Origin Resource Sharing (CORS) protection, for added security.
enableCORS = false

# Enables support for Cross-Site Request Forgery (XSRF) protection, for added security.
enableXsrfProtection = false

# Max size, in megabytes, for files uploaded with the file_uploader.
maxUploadSize = 200

# Max size, in megabytes, of messages that can be sent via the WebSocket connection.
maxMessageSize = 200

# Enables support for websocket compression.
enableWebsocketCompression = false

[browser]

# Internet address where users should point their browsers in order to connect to the app. Can be IP address or DNS name and path.
serverAddress = "localhost"

# Whether to send usage statistics to Streamlit.
gatherUsageStats = false

# Port where users should point their browsers in order to connect to the app. This can differ from server.port in case you're running Streamlit behind a reverse proxy.
serverPort = 8501

[deprecation]

# Note: showfileUploaderEncoding and showPyplotGlobalUse have been removed in newer versions

[theme]

# Primary accent color for interactive elements.
primaryColor = "#667eea"

# Background color for the main content area.
backgroundColor = "#ffffff"

# Background color used for the sidebar and most interactive widgets.
secondaryBackgroundColor = "#f0f2f6"

# Color used for almost all text.
textColor = "#262730"

# Font family for all text in Streamlit apps.
font = "sans serif"
